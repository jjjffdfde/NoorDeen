  <script>
    const container = document.getElementById('kalimas-container');
    container.innerHTML = ISLAMIC_DATA.kalimas.map(k => `
      <div class="card" id="kalima-${k.id}" style="margin-bottom: 24px; border-top: 4px solid var(--color-gold);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
          <div>
            <h2 style="font-size: 1.3rem; color: var(--color-primary); font-weight: 700;">${k.name}</h2>
            <span style="font-size: 0.85rem; color: var(--color-text-muted);">${k.meaning}</span>
          </div>
          <span class="font-arabic" style="font-size: 1.3rem; color: var(--color-gold-dark); font-weight: 700;">${k.arabicTitle}</span>
        </div>

        <div class="ayah-arabic" style="font-size: 1.8rem; margin-bottom: 18px; color: var(--color-text-main);">
          ${k.ar}
        </div>

        <div style="font-style: italic; color: var(--color-gold-dark); font-size: 0.95rem; margin-bottom: 12px; line-height: 1.6;">
          ${k.tr}
        </div>

        <div style="font-size: 1.05rem; line-height: 1.7; color: var(--color-text-main); margin-bottom: 12px;">
          <strong>English Meaning:</strong> ${k.en}
        </div>

        <div class="urdu-text" style="font-size: 1.15rem; line-height: 2.2; color: var(--color-text-muted); border-top: 1px solid var(--color-border-subtle); padding-top: 10px;">
          <strong>اردو ترجمہ:</strong> ${k.ur}
        </div>
      </div>
    `).join('');
  </script>
