pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "NoorDeen"
include ':app'

def capacitorDir = new File(settingsDir, '../node_modules/@capacitor/android/capacitor')
if (capacitorDir.exists()) {
    include ':capacitor-android'
    project(':capacitor-android').projectDir = capacitorDir
}
